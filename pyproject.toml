[project]
name = "voidcraft-bridge-debug-capture"
version = "0.1.0"
description = "Let a local coding agent inspect application-selected browser state"
requires-python = ">=3.10,<4"
readme = "README.md"
license = "MIT"
dependencies = ["voidcraft-world-bridge>=0.1.1,<0.2"]

[dependency-groups]
dev = ["pytest>=7.4,<10"]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.26,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
voidcraft-world-bridge = { git = "https://github.com/voidcraft-world/voidcraft-world-bridge", rev = "127e2ebadcb7d0829e27f9b9d5c9becc90cdcd1d" }
