name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run pytest tests/test_store.py tests/test_plugin.py tests/test_safety.py
      - run: node --test tests/test_capture.mjs
      - name: Install using standard package metadata
        run: |
          capture_install="$RUNNER_TEMP/capture-install"
          uv venv --python '${{ matrix.python }}' "$capture_install"
          uv pip install --no-sources --python "$capture_install/bin/python" .
          cd "$RUNNER_TEMP"
          "$capture_install/bin/python" -c 'from voidcraft_bridge_debug_capture.plugin import DebugCapturePlugin; assert DebugCapturePlugin().routes()'
